name: Mobile quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const audit = require('/tmp/npm-audit.json');
          const counts = audit.metadata?.vulnerabilities || {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            const advisories = (item.via || []).filter(v => typeof v === 'object').map(v => ({
              title: v.title, range: v.range, url: v.url
            }));
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              affectedRange: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
              dependencyPaths: item.effects
            }));
          }
          NODE
      - name: TypeScript type check
        run: npm run typecheck
      - name: Validate release configuration
        run: npm run release:check
      - name: Expo environment diagnostics
        run: npx expo-doctor
